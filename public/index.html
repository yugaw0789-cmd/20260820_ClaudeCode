<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>シンプルタイマー</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏱️</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <h1 class="title">⏱️ シンプルタイマー</h1>

  <div class="mode-tabs" role="tablist" aria-label="機能を選択">
    <button class="mode-tab is-active" type="button" role="tab" aria-selected="true" aria-controls="timer-panel" data-mode="timer">タイマー</button>
    <button class="mode-tab" type="button" role="tab" aria-selected="false" aria-controls="stopwatch-panel" data-mode="stopwatch">ストップウォッチ</button>
    <button class="mode-tab" type="button" role="tab" aria-selected="false" aria-controls="clock-panel" data-mode="clock">時計</button>
    <button class="mode-tab" type="button" role="tab" aria-selected="false" aria-controls="calc-panel" data-mode="calc">電卓</button>
  </div>

  <section id="timer-panel" class="mode-panel" role="tabpanel">
  <div class="dial">
    <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
      <circle class="ring-bg" cx="100" cy="100" r="92"></circle>
      <circle class="ring-fg" cx="100" cy="100" r="92"></circle>
    </svg>
    <div class="readout">
      <output id="display" class="display" aria-live="off">05:00</output>
      <span id="status" class="status">停止中</span>
    </div>
  </div>

  <div class="inputs">
    <label>
      <span>時</span>
      <input id="hours" type="number" min="0" max="99" value="0" inputmode="numeric">
    </label>
    <label>
      <span>分</span>
      <input id="minutes" type="number" min="0" max="59" value="5" inputmode="numeric">
    </label>
    <label>
      <span>秒</span>
      <input id="seconds" type="number" min="0" max="59" value="0" inputmode="numeric">
    </label>
  </div>

  <div class="presets">
    <button class="preset" data-seconds="60" type="button">1分</button>
    <button class="preset" data-seconds="180" type="button">3分</button>
    <button class="preset" data-seconds="300" type="button">5分</button>
    <button class="preset" data-seconds="600" type="button">10分</button>
    <button class="preset" data-seconds="1500" type="button">25分</button>
  </div>

  <div class="controls">
    <button id="startPause" class="btn btn-primary" type="button">スタート</button>
    <button id="reset" class="btn" type="button">リセット</button>
  </div>

  <p class="hint">スペースキーで開始 / 一時停止、R キーでリセット</p>
  </section>

  <section id="stopwatch-panel" class="mode-panel" role="tabpanel" hidden>
    <div class="stopwatch-readout">
      <output id="stopwatchDisplay" class="stopwatch-display" aria-live="off">00:00.00</output>
      <span id="stopwatchStatus" class="status">停止中</span>
    </div>
    <div class="controls">
      <button id="stopwatchStartPause" class="btn btn-primary" type="button">スタート</button>
      <button id="stopwatchLap" class="btn" type="button">ラップ</button>
      <button id="stopwatchReset" class="btn" type="button">リセット</button>
    </div>
    <ol id="laps" class="laps" aria-label="ラップタイム"></ol>
    <p class="hint">スペースキーで開始 / 一時停止、R キーでリセット</p>
  </section>

  <section id="clock-panel" class="mode-panel" role="tabpanel" hidden>
    <div class="clock-readout">
      <time id="clockDisplay" class="clock-display">00:00:00</time>
      <time id="clockDate" class="clock-date">----</time>
    </div>
    <p class="hint">端末のローカル時刻を表示しています</p>
  </section>

  <section id="calc-panel" class="mode-panel" role="tabpanel" hidden>
    <div class="calc-readout">
      <span id="calcExpression" class="calc-expression"></span>
      <output id="calcDisplay" class="calc-display" aria-live="polite">0</output>
    </div>
    <div class="keypad">
      <button class="key key-fn" type="button" data-action="clear">C</button>
      <button class="key key-fn" type="button" data-action="backspace" aria-label="1文字削除">←</button>
      <button class="key key-fn" type="button" data-action="percent">%</button>
      <button class="key key-op" type="button" data-op="/" aria-label="割る">÷</button>

      <button class="key" type="button" data-digit="7">7</button>
      <button class="key" type="button" data-digit="8">8</button>
      <button class="key" type="button" data-digit="9">9</button>
      <button class="key key-op" type="button" data-op="*" aria-label="掛ける">×</button>

      <button class="key" type="button" data-digit="4">4</button>
      <button class="key" type="button" data-digit="5">5</button>
      <button class="key" type="button" data-digit="6">6</button>
      <button class="key key-op" type="button" data-op="-" aria-label="引く">−</button>

      <button class="key" type="button" data-digit="1">1</button>
      <button class="key" type="button" data-digit="2">2</button>
      <button class="key" type="button" data-digit="3">3</button>
      <button class="key key-op" type="button" data-op="+" aria-label="足す">+</button>

      <button class="key key-fn" type="button" data-action="negate" aria-label="符号を反転">±</button>
      <button class="key" type="button" data-digit="0">0</button>
      <button class="key" type="button" data-action="decimal">.</button>
      <button class="key key-equals" type="button" data-action="equals" aria-label="計算する">=</button>
    </div>
    <p class="hint">数字キー・演算子キー、Enter で計算、Backspace で 1 文字削除、Esc でクリア</p>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
